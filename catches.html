<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釣果一覧 - JIG LOG</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">JIG <span>LOG</span></a><a class="home-btn" href="index.html">⌂ HOME</a></div></header><header><div class="logo">🎣 JIG LOG</div><div class="subtitle">JIGGING × LOG × ANALYZE</div></header><main>
<section class="card"><h1>📋 釣果一覧</h1><a class="btn primary" href="catch.html">＋ 釣果登録</a></section><div id="list" class="list"></div></main><script src="script.js"></script><script>
function render(){const cs=get("catches").slice().reverse(),ts=get("fishingTrips");list.innerHTML=cs.length?cs.map(c=>{const t=ts.find(x=>String(x.id)===String(c.fishingId));return `<article class="item"><div class="item-head"><strong>🐟 ${esc(c.fish)}</strong><span>${esc(t?.date||"-")}</span></div><div class="meta">サイズ ${esc(c.size||"-")}cm / 重量 ${esc(c.weight||"-")}kg</div><div class="meta">ジグ：${esc(c.jig||"-")} / ${esc(c.jigWeight||"-")}g / ${esc(c.color||"-")}</div><div class="meta">ヒット ${esc(c.hitDepth||"-")}m / ライン角度 ${esc(c.lineAngle||"-")}° / ${esc(c.action||"-")} / ${esc(c.hitTime||"-")}</div><div class="buttons"><a class="btn secondary" href="trip-detail.html?id=${encodeURIComponent(c.fishingId)}">🎣 釣行詳細</a><button class="danger" onclick="delCatch('${c.id}')">削除</button></div></article>`}).join(""):'<div class="box note">まだ釣果がありません。</div>'}
function delCatch(id){if(!confirm("削除しますか？"))return;put("catches",get("catches").filter(x=>String(x.id)!==String(id)));render()}render()
</script><footer>JIG LOG — YOUR JIGGING DATA, YOUR NEXT BITE.</footer></body></html>
