<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ジグ図鑑 - JIG LOG</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">JIG <span>LOG</span></a><a class="home-btn" href="index.html">⌂ HOME</a></div></header><header><div class="logo">🎣 JIG LOG</div><div class="subtitle">JIGGING × LOG × ANALYZE</div></header><main>
<section class="card"><h1>🔱 ジグ図鑑</h1><div class="grid"><div class="field"><label>名称</label><input id="name"></div><div class="field"><label>メーカー</label><input id="maker"></div><div class="field"><label>重量(g)</label><input id="weight"></div><div class="field"><label>カラー</label><input id="color"></div><div class="field"><label>タイプ</label><input id="type" placeholder="ロングなど"></div><div class="field"><label>メモ</label><input id="memo"></div></div><div class="buttons"><button class="primary" onclick="saveJig()">＋ 登録</button></div></section><section class="box"><h2>登録済みジグ</h2><div id="list" class="list"></div></section></main><script src="script.js"></script><script>
function saveJig(){if(!name.value.trim()){alert("ジグ名を入力してください");return}const a=get("jigs");a.push({id:Date.now(),name:name.value,maker:maker.value,weight:weight.value,color:color.value,type:type.value,memo:memo.value});put("jigs",a);name.value=maker.value=weight.value=color.value=type.value=memo.value="";render()}
function render(){const a=get("jigs");list.innerHTML=a.length?a.slice().reverse().map(x=>`<article class="item"><div class="item-head"><strong>🔱 ${esc(x.name)}</strong><button class="danger" onclick="delJig('${x.id}')">削除</button></div><div class="meta">${esc(x.maker||"-")} / ${esc(x.weight||"-")}g / ${esc(x.color||"-")} / ${esc(x.type||"-")}</div><div class="meta">${esc(x.memo||"")}</div></article>`).join(""):'<div class="note">まだ登録がありません。</div>'}
function delJig(id){if(!confirm("削除しますか？"))return;put("jigs",get("jigs").filter(x=>String(x.id)!==String(id)));render()}render()
</script><footer>JIG LOG — YOUR JIGGING DATA, YOUR NEXT BITE.</footer></body></html>
