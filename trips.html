<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釣行履歴 - JIG LOG</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">JIG <span>LOG</span></a><a class="home-btn" href="index.html">⌂ HOME</a></div></header><header><div class="logo">🎣 JIG LOG</div><div class="subtitle">JIGGING × LOG × ANALYZE</div></header><main>
<section class="card"><h1>🗓️ 釣行履歴</h1></section><div id="list" class="list"></div></main><script src="script.js"></script><script>
function render(){const ts=get("fishingTrips").slice().reverse(),cs=get("catches"),j=get("jigs"),tack=get("tackleSets");list.innerHTML=ts.length?ts.map(t=>{const c=cs.filter(x=>String(x.fishingId)===String(t.id)),max=Math.max(0,...c.map(x=>Number(x.size)||0)),names=[...new Set(c.map(x=>x.fish).filter(Boolean))];const tj=tack.find(x=>String(x.id)===String(t.tackleSetId));return `<article class="item"><div class="item-head"><strong>🎣 ${esc(t.date||"-")} / ${esc(t.boat||"-")}</strong><span>${c.length}匹</span></div><div class="meta">${esc(t.area||"-")} / 水深 ${esc(t.depth||"-")}m / ${esc(t.tide||"-")}</div><div class="tags">${names.map(x=>`<span class="tag">${esc(x)}</span>`).join("")}</div><div class="meta">最大 ${max||"-"}cm / タックル ${esc(tj?.name||"未選択")}</div><a class="btn primary" href="trip-detail.html?id=${encodeURIComponent(t.id)}">詳細を見る</a></article>`}).join(""):'<div class="box note">まだ釣行がありません。</div>'}render()
</script><footer>JIG LOG — YOUR JIGGING DATA, YOUR NEXT BITE.</footer></body></html>
