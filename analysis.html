<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>分析 - JIG LOG</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">JIG <span>LOG</span></a><a class="home-btn" href="index.html">⌂ HOME</a></div></header><header><div class="logo">🎣 JIG LOG</div><div class="subtitle">JIGGING × LOG × ANALYZE</div></header><main>
<section class="card"><h1>📊 JIG LOG分析</h1><p class="lead">ジグだけでなく、タックルセット別の実績も確認できます。</p><div class="grid"><div class="field"><label>エリア</label><select id="area"><option value="">すべて</option></select></div><div class="field"><label>魚種</label><select id="fish"><option value="">すべて</option></select></div><div class="field"><label>月</label><select id="month"><option value="">すべて</option></select></div></div><button class="primary" onclick="render()">🔍 分析</button></section>
<section class="box"><h2>📈 全体</h2><div id="summary" class="stats"></div></section>
<section class="box"><h2>🎣 タックルセット別実績</h2><p class="note">釣果数・最大サイズ・平均サイズ・主な魚種を表示します。</p><div id="tackleRank" class="rank"></div></section>
<section class="box"><h2>🔱 ジグ別実績</h2><div id="jigRank" class="rank"></div></section>
<section class="box"><h2>🐟 魚種別</h2><div id="fishRank" class="rank"></div></section></main><script src="script.js"></script><script>
function fill(){const ts=get("fishingTrips"),cs=get("catches");area.innerHTML='<option value="">すべて</option>'+[...new Set(ts.map(x=>x.area).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("");fish.innerHTML='<option value="">すべて</option>'+[...new Set(cs.map(x=>x.fish).filter(Boolean))].map(x=>`<option>${esc(x)}</option>`).join("");month.innerHTML='<option value="">すべて</option>'+Array.from({length:12},(_,i)=>`<option value="${i+1}">${i+1}月</option>`).join("")}
function selected(){const ts=get("fishingTrips"),a=area.value,f=fish.value,m=month.value;const ok=ts.filter(t=>(!a||t.area===a)&&(!m||Number((t.date||"").split("-")[1])===Number(m)));const ids=new Set(ok.map(t=>String(t.id)));return get("catches").filter(c=>ids.has(String(c.fishingId))&&(!f||c.fish===f))}
function topStats(arr,key){const d={};arr.forEach(x=>{const k=x[key]||"未登録";d[k]=(d[k]||0)+1});return Object.entries(d).sort((a,b)=>b[1]-a[1]).slice(0,10)}
function render(){const cs=selected(),ts=get("fishingTrips"),sets=get("tackleSets"),jigs=get("jigs");summary.innerHTML=`<div class="stat"><span>釣果</span><strong>${cs.length}</strong><small>匹</small></div><div class="stat"><span>最大サイズ</span><strong>${Math.max(0,...cs.map(x=>Number(x.size)||0))||"-"}</strong><small>cm</small></div><div class="stat"><span>平均サイズ</span><strong>${cs.length?(cs.reduce((s,x)=>s+(Number(x.size)||0),0)/cs.filter(x=>Number(x.size)>0).length||0).toFixed(1):"-"}</strong><small>cm</small></div><div class="stat"><span>平均ヒット水深</span><strong>${cs.length?(cs.reduce((s,x)=>s+(Number(x.hitDepth)||0),0)/cs.filter(x=>Number(x.hitDepth)>0).length||0).toFixed(1):"-"}</strong><small>m</small></div>`;
const sid={};cs.forEach(c=>{const t=ts.find(x=>String(x.id)===String(c.fishingId));const k=String(t?.tackleSetId||"none");if(!sid[k])sid[k]=[];sid[k].push(c)});const sr=Object.entries(sid).map(([k,a])=>({name:sets.find(x=>String(x.id)===k)?.name||"タックル未選択",n:a.length,max:Math.max(...a.map(x=>Number(x.size)||0)),avg:a.filter(x=>Number(x.size)>0).reduce((s,x)=>s+Number(x.size),0)/(a.filter(x=>Number(x.size)>0).length||1),fish:topStats(a,"fish")[0]?.[0]||"-"})).sort((a,b)=>b.n-a.n);tackleRank.innerHTML=sr.length?sr.map((x,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-main"><strong>${esc(x.name)}</strong><small>${esc(x.fish)} / 平均${x.avg.toFixed(1)}cm / 最大${x.max||"-"}cm</small></div><strong>${x.n}匹</strong></div>`).join(""):'<div class="note">データなし</div>';
const jr=topStats(cs,"jig");jigRank.innerHTML=jr.length?jr.map((x,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-main"><strong>🔱 ${esc(x[0])}</strong></div><strong>${x[1]}匹</strong></div>`).join(""):'<div class="note">データなし</div>';
const fr=topStats(cs,"fish");fishRank.innerHTML=fr.length?fr.map((x,i)=>`<div class="rank-row"><div class="rank-no">${i+1}</div><div class="rank-main"><strong>🐟 ${esc(x[0])}</strong></div><strong>${x[1]}匹</strong></div>`).join(""):'<div class="note">データなし</div>'}
fill();render()
</script><footer>JIG LOG — YOUR JIGGING DATA, YOUR NEXT BITE.</footer></body></html>
