<!doctype html><html lang="ja"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>釣行詳細 - JIG LOG</title><link rel="stylesheet" href="style.css"></head><body><header class="site-header"><div class="container nav"><a class="logo" href="index.html">JIG <span>LOG</span></a><a class="home-btn" href="index.html">⌂ HOME</a></div></header><header><div class="logo">🎣 JIG LOG</div><div class="subtitle">JIGGING × LOG × ANALYZE</div></header><main id="app"></main><script src="script.js"></script><script>
const id=new URLSearchParams(location.search).get("id"),t=get("fishingTrips").find(x=>String(x.id)===String(id)),cs=get("catches").filter(x=>String(x.fishingId)===String(id)),j=get("jigs"),sets=get("tackleSets"),rods=get("rods"),reels=get("reels"),lines=get("lines");
if(!t){app.innerHTML='<section class="box"><h1>釣行が見つかりません</h1></section>'}else{
const set=sets.find(x=>String(x.id)===String(t.tackleSetId)),r=rods.find(x=>String(x.id)===String(set?.rodId)),e=reels.find(x=>String(x.id)===String(set?.reelId)),l=lines.find(x=>String(x.id)===String(set?.lineId));
app.innerHTML=`<section class="hero"><h1>🎣 ${esc(t.date||"-")} / ${esc(t.boat||"-")}</h1><p>${esc(t.area||"-")} ・ ${esc(t.tide||"-")} ・ 水深${esc(t.depth||"-")}m</p></section>
<section class="box"><h2>釣行情報</h2><div class="stats"><div class="stat"><span>釣果</span><strong>${cs.length}</strong></div><div class="stat"><span>最大サイズ</span><strong>${Math.max(0,...cs.map(x=>Number(x.size)||0))||"-"}</strong><small>cm</small></div><div class="stat"><span>水温</span><strong>${esc(t.waterTemp||"-")}</strong></div><div class="stat"><span>潮流</span><strong>${esc(t.current||"-")}</strong></div></div><p class="note">天気：${esc(t.weather||"-")}</p></section>
<section class="box"><h2>🎣 使用タックル</h2><p><strong>${esc(set?.name||"未選択")}</strong></p><div class="meta">ロッド：${esc(r?.name||"-")} ${esc(r?.model||"")}</div><div class="meta">リール：${esc(e?.name||"-")} ${esc(e?.size||"")}</div><div class="meta">ライン：${esc(l?.name||"-")} PE${esc(l?.size||"")} / リーダー ${esc(l?.leaderSize||"-")}</div></section>
<section class="box"><h2>🐟 釣果</h2><a class="btn primary" href="catch.html?tripId=${encodeURIComponent(t.id)}">＋ この釣行の釣果を追加</a><div class="list" style="margin-top:12px">${cs.length?cs.map(c=>`<article class="item"><strong>🐟 ${esc(c.fish)}</strong><div class="meta">${esc(c.size||"-")}cm / ${esc(c.weight||"-")}kg</div><div class="meta">🔱 ${esc(c.jig||"-")} / ${esc(c.jigWeight||"-")}g / ${esc(c.color||"-")}</div><div class="meta">🌊 ${esc(c.hitDepth||"-")}m / 📐 ${esc(c.lineAngle||"-")}° / 🔄 ${esc(c.action||"-")} / ⏰ ${esc(c.hitTime||"-")}</div></article>`).join(""):'<div class="note">まだ釣果がありません。</div>'}</div></section>`}
</script><footer>JIG LOG — YOUR JIGGING DATA, YOUR NEXT BITE.</footer></body></html>
